[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.1.0"
description = "A replay-capable evaluation harness for tool-using agents, that evaluates recorded traces and never runs an agent."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ravi Ramchandran" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
gui = [
    "streamlit>=1.38",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
